<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скидки Магнита</title>
    <link rel="stylesheet" href="/static/css/style.css?v=6">
</head>
<body>
    <header>
        <div class="header-top">
            <h1>🔥 Скидки Магнита</h1>
            <span class="subtitle" id="stats"></span>
        </div>
        <div class="controls-row">
            <select id="city-select"><option value="">Все города</option></select>
            <select id="store-select"><option value="">Выберите магазин</option></select>
            <label class="checkbox-label"><input type="checkbox" id="all-city"> Все магазины города</label>
            <button id="parse-btn" class="btn-primary">🔄 Загрузить скидки</button>
        </div>
        <div class="controls-row">
            <input type="text" id="search-input" placeholder="Поиск товара...">
            <select id="sort-select">
                <option value="discount_desc">Скидка % ↓</option>
                <option value="savings_desc">Выгода ₽ ↓</option>
                <option value="price_asc">Цена ↑</option>
                <option value="price_desc">Цена ↓</option>
                <option value="stock_desc">Остаток ↓</option>
            </select>
            <select id="discount-filter">
                <option value="0">Любая скидка</option>
                <option value="10">от 10%</option>
                <option value="20">от 20%</option>
                <option value="30">от 30%</option>
                <option value="40">от 40%</option>
                <option value="50">от 50%</option>
                <option value="60">от 60%</option>
                <option value="70">от 70%</option>
                <option value="80">от 80%</option>
                <option value="90">от 90%</option>
            </select>
            <select id="stock-filter">
                <option value="0">Любой остаток</option>
                <option value="5">от 5 шт</option>
                <option value="10">от 10 шт</option>
                <option value="50">от 50 шт</option>
            </select>
            <label class="checkbox-label"><input type="checkbox" id="adult-only"> 18+</label>
            <button id="favorites-btn">⭐ Избранное</button>
        </div>
        <div class="quick-search">
            <button class="tag-btn" data-term="">📦 Все</button>
            <button class="tag-btn" data-term="вино">🍷 Вино</button>
            <button class="tag-btn" data-term="пиво">🍺 Пиво</button>
            <button class="tag-btn" data-term="водка">🥃 Водка</button>
            <button class="tag-btn" data-term="виски">🥃 Виски</button>
            <button class="tag-btn" data-term="коньяк">🥃 Коньяк</button>
            <button class="tag-btn" data-term="шампанское">🍾 Игристое</button>
            <button class="tag-btn" data-term="сыр">🧀 Сыр</button>
            <button class="tag-btn" data-term="кофе">☕ Кофе</button>
            <button class="tag-btn" data-term="шоколад">🍫 Шоколад</button>
        </div>
        <div id="progress-bar" class="progress-bar" style="display:none">
            <div class="progress-fill" id="progress-fill"></div>
            <span class="progress-text" id="progress-text">Загрузка...</span>
        </div>
    </header>

    <main>
        <div id="products-grid" class="products-grid"></div>
        <div id="loading" class="loading" style="display:none">⏳ Загрузка...</div>
        <div id="empty" class="empty">Выберите город и магазин, затем нажмите «Загрузить скидки»</div>
        <div id="pagination" class="pagination"></div>
    </main>

    <!-- Модальное окно товара -->
    <div id="product-modal" class="modal" style="display:none">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">✕</button>
            <div class="modal-body">
                <div class="modal-image">
                    <img id="modal-img" src="" alt="">
                    <div class="modal-badge" id="modal-badge"></div>
                </div>
                <div class="modal-info">
                    <h2 id="modal-name"></h2>
                    <div class="modal-price">
                        <span class="price-current" id="modal-price"></span>
                        <span class="price-old" id="modal-old-price"></span>
                    </div>
                    <div class="modal-meta" id="modal-meta"></div>
                    <div class="modal-savings" id="modal-savings"></div>
                    <h3>🏪 Где купить</h3>
                    <div id="modal-stores" class="modal-stores"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/script.js?v=6"></script>
</body>
</html>
